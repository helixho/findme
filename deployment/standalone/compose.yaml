name: findme
services:
  postgres:
    # Local database; not started when runtime.env points to an external database.
    profiles: [local-db]
    image: postgres:18-bookworm
    restart: unless-stopped
    environment:
      POSTGRES_DB: findme
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-}
    volumes:
      - ${FINDME_STATE_DIR}/postgres:/var/lib/postgresql
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U postgres -d findme']
      interval: 10s
      timeout: 5s
      retries: 12
    logging:
      options: {max-size: 10m, max-file: '3'}
