name: Verify

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.9
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - name: Repository documentation and static references
        run: node scripts/check-repository.mjs
      - name: API typecheck
        run: pnpm --filter @findme/api exec tsc --noEmit
      - name: Workspace typecheck and build
        run: pnpm build
      - name: Formal App unit tests
        run: pnpm test:app
      - name: Runner tests and DB-free synthetic API group
        run: pnpm test:local
      - name: Real isolated PostgreSQL group (Docker, no production secrets)
        run: pnpm test:db
      - name: Install Chromium for formal App browser regressions
        run: pnpm exec playwright install --with-deps chromium
      - name: Formal App synthetic and real PostgreSQL browser tests
        run: pnpm test:browser
      - name: Maintained App native/private behavior
        run: node scripts/test-maintenance-browser.mjs
