const EXAMPLE='上次分工说清楚之后，那块是我主动接下来的。我只是没弄清楚谁负责拍板，不是不愿意协作。';

const NEW='职责不清时，你会暂缓表达；分工明确后，你愿意主动承担。';
const SOURCES=[
 {id:'S1',name:'项目整理',type:'支持条件',quote:'目标定下来之后，我自己安排顺序，推进得很顺。',effect:'支持“明确目标与自主安排同时出现时，投入较顺畅”。无法区分两种条件各自起多大作用。'},
 {id:'S2',name:'协作讨论',type:'限定范围',quote:'会上我没接话，因为不知道谁负责最后拍板。',effect:'迟疑出现在职责不清的情境。工作与表达专题共用这段记录，不把它当成两份独立证据。'},
 {id:'S3',name:'分工后的补充',type:'新增反例',quote:EXAMPLE,effect:'分工明确时曾主动承担，反驳了泛指所有协作的描述，因此收窄原判断的范围。'}

const TOPICS={
 work:{label:'工作与投入',title:'什么条件下，<br>你更容易投入？',card:'目标、自主空间与协作边界，怎样影响投入。',intro:'在目标清楚、可以自主安排时，你更容易把事情持续推进。但这还不足以说明，你需要始终独自工作。',body:'示例记录里，目标明确与自主安排是一起出现的。我们可以先保留“这些条件有利于投入”的观察，而不急着把它解释成一个固定特征。',alternative:'可能是任务边界变得清楚，也可能是你熟悉这类工作，或恰好拥有完整的时间。现有材料还不能把这些解释分开。',scope:'两次示例工作经历；不代表所有项目，也不延伸到关系、生活或稳定能力。',unknown:'职责明确、但需要频繁沟通时，投入会不会依然顺畅？',sourceIds:[0,1]},
 relation:{label:'关系与表达',title:'没接话的那一刻，<br>你在确认什么？',card:'一次沉默背后，可能还有没说清楚的背景。',intro:'一次讨论里的沉默，同时涉及工作分配和表达。先把当时的处境说清楚，再理解这次没有接话。',body:'“不知道谁负责拍板”是这次迟疑的重要背景。它能帮助限定解释，却不能证明所有沉默都有同一个原因，更不能概括为不善表达。',alternative:'也可能是当时还没有形成观点，或讨论的目标仍然模糊。需要其他情境中的经历，才能继续区分。',scope:'工作协作中的一次表达；亲密关系、日常社交与冲突中的表达仍然未知。',unknown:'在职责清楚、意见不一致的讨论里，你通常怎样表达？',sourceIds:[1]},
 energy:{label:'精力与节奏',title:'投入顺畅之后，<br>恢复得怎么样？',card:'推进得顺利，不等于精力始终充足。这里仍然未知。',intro:'目前知道事情有时推进得顺畅，但不知道身体感受、睡眠、负担和恢复成本。这里先保留空白。',body:'一段关于工作过程的描述，并没有提供身体状态的信息。不能用工作完成得好，代替对精力状态的了解。',alternative:'顺畅可能来自任务熟悉、支持充足或短时集中。它们都不能单独说明精力充足或不足。',scope:'现有示例只描述工作过程，没有覆盖睡眠、身体感受或连续多日的恢复。',unknown:'连续投入之后是否疲惫？休息是否足够？当时还有哪些生活负担？',sourceIds:[0]}
};
const state={revised:false,pending:[],draft:{topic:'work',text:'',reason:'context'},drafts:{},lastFocus:null,evidenceContext:'work',evidenceOld:false};
const $=s=>document.querySelector(s);
const escapeHTML=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const link=(route,text,cls='')=>`<a href="#${route}" class="${cls}" data-route="${route}">${text}</a>`;
const tag=(text,cls='')=>`<span class="tag ${cls}">${text}</span>`;
const version=()=>state.revised?2:1;
function route(){const bits=location.hash.slice(1).split('/');return {page:['home','overview','topics','topic','correct','revision','history','pending'].includes(bits[0])?bits[0]:'home',topic:TOPICS[bits[1]]?bits[1]:'work',old:bits[2]==='1',pendingId:Number(bits[1])||0};}
function nav(active){return `<nav class="navigation" aria-label="主导航">${[['home','整体认识'],['topics','专题阅读'],['history','纠正与修订']].map(([key,label])=>`<a href="#${key}" data-route="${key}" class="${active===key?'active':''}" ${active===key?'aria-current="page"':''}>${icon(key)}<span>${label}</span></a>`).join('')}</nav>`;}
function shell(body){const r=route();const active=['home','overview'].includes(r.page)?'home':['topic','topics'].includes(r.page)?'topics':'history';return `<header class="header"><div class="header-inner">${link('home',MARK+'找我<em>FindMe</em>','brand')}${nav(active)}<span class="demo">虚构示例</span></div></header><main id="main-content" tabindex="-1" class="enter">${body}</main><footer class="footer"><span>FindMe　/　一份可以修订的自我认识</span><span>设计原型 · 虚构内容 · 未连接真实数据</span></footer><div class="bottom-nav">${nav(active)}</div>`;}
function summary(){return state.revised?'目标明确、可以自主安排时，你更容易持续投入。协作中的迟疑需要看清背景：新的补充表明，职责清楚之后，你也会主动承担。':'目标明确、可以自主安排时，你更容易持续投入。协作中的迟疑还不能简单归因于“不愿参与”，当时的分工与决策边界值得先弄清楚。';}
function topicCards(){return Object.entries(TOPICS).map(([key,t])=>link('topic/'+key,`${tag(key==='energy'?'资料不足 · 保持未知':state.revised?'已纳入修订':'有依据 · 待澄清',state.revised&&key!=='energy'?'current':'')}<h3>${t.label}</h3><p>${t.card}</p><span class="foot"><span>阅读专题</span>${icon('right')}</span>`,'topic-card')).join('');}
function home(){return `<section class="hero"><div><div class="meta"><span>当前个人理解</span>${tag('版本 '+version(),'current')}<span>${state.revised?'已纳入新的背景':'基于两段示例记录'}</span></div><h1>投入需要空间，<br>也需要清晰的边界。</h1><p class="lead">${summary()}</p><div class="actions">${link('overview','阅读整体认识','button primary')}<button class="text-button" data-evidence="all">查看这份理解的依据</button></div></div><aside class="hero-side"><div class="version"><span class="small muted">当前版本</span><span class="accent">${String(version()).padStart(2,'0')}</span></div><div class="rule"></div><h3>先保留一个问号</h3><p>${state.revised?'范围已经收窄，原因还未完全确定。新的理解也允许继续被修正。':'迟疑是不愿参与，还是职责还不清楚？这个解释，需要你知道的背景。'}</p>${link(state.revised?'revision':'topic/work',state.revised?'看看这次改变了什么':'读这条判断','text-button')}</aside></section>${state.revised?`<div class="update-strip">${icon('check')}<div class="copy"><h3>一处判断，已收窄到具体情境。</h3><p>工作与表达专题已同步更新，精力仍然未知。</p></div>${link('revision','查看修订前后','text-button')}</div>`:''}<section class="summary-notes" aria-label="整体理解的重点"><div class="summary-note">${icon('scope')}<div><h3>有利条件</h3><p>清晰的目标与可自主安排的空间，可能帮助你投入。</p></div></div><div class="summary-note">${icon('question')}<div><h3>仍然未知</h3><p>高频沟通下的投入，以及投入之后的恢复成本。</p></div></div></section><section class="section"><div class="section-heading"><h2>从整体，走进具体</h2>${link('topics','全部专题','text-button')}</div><div class="topics">${topicCards()}</div></section><section class="section"><details class="relation"><summary><span>这些专题，为什么放在一起？<small>展开查看共同情境，关系图不作为阅读前提</small></span>${icon('down')}</summary><div class="relation-content"><div class="connection"><div class="event">同一段示例：职责不清的协作</div>${link('topic/work','工作与投入','button quiet')}${link('topic/relation','关系与表达','button quiet')}<div class="no-line">精力与节奏：尚无足够信息建立关联</div></div><div class="relation-copy"><h3>一个情境，两个观察角度。</h3><p>工作与表达共用记录 S2，它们相连是因为引用同一经历，不代表两份独立证据，也不代表因果。精力信息不足，因此不画连线。</p></div></div></details></section>`;}
function back(to='home',label='返回整体认识'){return `<div class="back-row">${link(to,icon('left')+label,'back-link')}<span class="small muted">示例报告</span></div>`;}
function marginNotes(t,old=false){return `<aside class="margin-notes"><div class="version-label">${old?'历史版本 1 · 只读':'当前版本 '+(t===TOPICS.energy?1:version())}</div><section><h3>理解的范围</h3><p>${t.scope}</p></section><section><h3>还缺什么</h3><p>${t.unknown}</p></section><section><h3>你可以不同意</h3><p>指出事实、背景或解释的问题。新的补充需要核验，认可也不自动增加证据。</p></section></aside>`;}
function overview(){return `${back()}<div class="reading-layout"><article class="reading"><div class="meta"><span>整体认识</span>${tag('版本 '+version(),'current')}<span>基于${state.revised?'三':'两'}段示例记录</span></div><h1>你需要的，可能不只是<br>一个人做事的空间。</h1><p class="intro">${summary()}</p><section class="reading-section" id="conditions"><h2>清楚的目标，让投入有了着落</h2><p>在项目整理的经历里，你提到了“目标定下来”和“自己安排顺序”，之后事情推进得比较顺。明确目标和自主空间，可以作为目前有利条件的观察。</p><p>但它们是一起出现的。现在还不能说，究竟是自主性、任务清晰度，还是熟悉程度起了主要作用。</p><button class="text-button" data-evidence="work">核对这部分依据</button></section><section class="reading-section" id="tension"><h2>协作里的迟疑，需要放回当时</h2><p>${state.revised?'新的补充表明，在分工明确之后，你曾主动接下任务。原先“协作时倾向退后”的描述，把一次具体情境说得太宽。因此，当前理解收窄到职责不清时暂缓表达。':'协作讨论里的“没接话”，发生在不知道谁负责拍板的时候。把它直接归为不愿参与，会遗漏当时的职责边界。'}</p><p>一个更值得继续理解的问题是：当目标和职责都清楚时，沟通密度本身会不会仍然带来负担？这还没有答案。</p>${link('topic/work','展开工作与投入专题','text-button')}</section><section class="reading-section" id="unknown"><h2>还有空白，不急着补满</h2><p>精力、恢复以及工作之外的关系都缺少材料。任务顺利不能证明精力充足，一次沉默也不能概括所有表达。</p><p>目前的认识只覆盖这些示例经历。以后如果出现相反的经历，我们需要重新看条件与范围，而不是把它解释成例外后忽略。</p></section><div class="claim-box"><div class="claim-id">${tag(state.revised?'当前已修订':'最值得你核对的一句话',state.revised?'current':'')}<span class="small muted">判断 J1</span></div><h2>${state.revised?NEW:OLD}</h2><p>${state.revised?'这次更正改变的是判断范围，而不是为所有迟疑确定一个原因。':'这句话可能描述得太宽。你知道的背景，可以帮助我们判断应该保留、收窄还是撤回它。'}</p><div class="actions">${link('correct/work','纠正或补充这句话','button primary')}${state.revised?link('revision','查看修订前后','button'): '<button class="button" data-evidence="work">依据与反例</button>'}</div></div><a href="#topic/work" data-route="topic/work" class="next-topic"><div><small>继续深入</small><span>工作与投入</span></div>${icon('right')}</a></article><aside class="margin-notes"><div class="version-label">一份有范围的整体理解</div><section class="contents"><h3>本页内容</h3><a href="#conditions" data-section="conditions">有利条件</a><a href="#tension" data-section="tension">关键张力</a><a href="#unknown" data-section="unknown">尚未确定</a></section><section><h3>阅读方式</h3><p>先读完整解释，再按需要展开原话。不同意时，可以直接回应具体判断。</p></section><section><h3>当前依据</h3><p>${state.revised?'两段原记录与一段新增反例。':'两段原记录。'}同一来源在不同专题中出现，不重复计算。</p><button class="text-button" data-evidence="all">查看来源</button></section></aside></div>`;}
function topics(){return `<div class="intro-block"><div class="meta"><span>专题阅读</span><span>同一份当前理解</span></div><h1>把认识，放回具体情境。</h1><p class="lead">每个专题保留自己的依据、范围与未知。它们共同帮助理解你，但不会被拼成一个总分。</p></div><div class="topics">${topicCards()}</div><section class="section"><div class="plain-unknown"><h3>专题之间，共用哪些材料？</h3><p>工作与表达引用同一段协作经历；精力缺少足够材料。材料没有覆盖的领域，暂时不作判断。</p>${link('overview','回到整体，看看它们如何放在一起','text-button')}</div></section>`;}
function topic(key,old){const t=TOPICS[key];old=old&&state.revised&&key!=='energy';const revised=state.revised&&!old&&key!=='energy';return `${back('topics','全部专题')}<div class="topic-switch" aria-label="切换专题">${Object.entries(TOPICS).map(([k,d])=>link('topic/'+k,d.label,k===key?'active':'')).join('')}</div>${old?`<div class="old-version"><p>正在阅读版本 1。此判断已被修订，保留在这里供对照。</p>${link('topic/'+key,'阅读当前版本 2','text-button')}</div>`:''}<div class="reading-layout"><article class="reading"><div class="meta"><span>${t.label}</span>${tag(key==='energy'?'资料不足':old?'历史版本 1':'版本 '+(revised?2:1),revised?'current':'')}<span>${key==='energy'?'保持未知':'有范围的阶段性理解'}</span></div><h1>${t.title}</h1><p class="intro">${revised&&key==='relation'?'新的补充让沉默的范围更清楚：分工明确后曾主动承担，因此不再把迟疑泛指到所有协作。':t.intro}</p><section class="reading-section"><h2>目前看到什么</h2><p>${t.body}</p><p class="aside-note">${key==='relation'?'与工作专题共用 S2，不重复计算为新证据。':key==='energy'?'这里保留未知，不给出评分。':'依据为两段示例记录，原话可以展开核对。'}</p><button class="text-button" data-evidence="${key}">查看依据与反例</button></section><section class="claim-box"><div class="claim-id">${tag(key==='energy'?'没有足够依据':revised?'已收窄范围':'待你核对的判断',revised?'current':'')}<span class="small muted">${key==='energy'?'状态 U1':'判断 J1'}</span></div><h2>${key==='energy'?'目前无法判断稳定的精力模式。':revised?NEW:OLD}</h2><p>${key==='energy'?'工作过程的描述，不能回答身体感受和恢复成本。':revised?'补充了分工明确时主动参与的反例。这次改变了范围，但没有确定所有迟疑的原因。':'“不知道谁拍板”可能是重要背景；这个描述还不足以成为稳定特征。'}</p><div class="actions">${old?link('topic/'+key,'阅读当前版本','button primary'):link('correct/'+key,key==='energy'?'补充新的经历':'纠正这句话','button primary')}<button class="button" data-evidence="${key}">核对原话</button></div>${revised?link('revision','查看这次修订的来由','text-button'):''}</section><section class="reading-section"><h2>还可能怎样解释</h2><p>${t.alternative}</p></section><section class="plain-unknown"><h3>还没有答案的问题</h3><p>${t.unknown}</p></section>${link('topic/'+(key==='work'?'relation':key==='relation'?'energy':'work'),`<div><small>继续阅读另一个侧面</small><span>${TOPICS[key==='work'?'relation':key==='relation'?'energy':'work'].label}</span></div>${icon('right')}`,'next-topic')}</article>${marginNotes(t,old)}</div>`;}
function correction(key){const t=TOPICS[key];state.draft=state.drafts[key]||(state.drafts[key]={topic:key,text:'',reason:'context'});const quote=key==='energy'?'目前无法判断稳定的精力模式。':state.revised?NEW:OLD;return `${back('topic/'+key,'返回专题')}<div class="intro-block"><div class="eyeline">纠正与补充</div><h1>让这句话，<br>更贴近当时的你。</h1><p class="lead">可以纠正事实，也可以补上当时的背景。不需要先认同这份理解。</p></div><div class="form-layout"><form id="correction-form" novalidate><div class="target-quote"><span class="small muted">正在回应 · ${t.label} · ${key==='energy'?'未知项 U1':'判断 J1'} · 版本 ${key==='energy'?1:version()}</span><blockquote>${quote}</blockquote></div><fieldset><legend>哪里需要重新理解？</legend><div class="choices">${[['context','缺少重要背景'],['scope','描述范围太宽'],['fact','事实或归属有误'],['time','现在已经不同']].map(([v,text])=>`<label class="choice"><input type="radio" name="reason" value="${v}" ${state.draft.reason===v?'checked':''}>${text}</label>`).join('')}</div></fieldset><div class="field-heading"><label class="field-label" for="correction-text">你知道的情况</label>${key!=='energy'?'<button class="text-button" id="fill-example" type="button">填入虚构示例</button>':''}</div><textarea id="correction-text" aria-describedby="draft-help correction-error" placeholder="哪部分不准确？当时还有什么没有写进来的情况？" required>${escapeHTML(state.draft.text)}</textarea><p class="help" id="draft-help">可以简短地说。不确定的部分，也可以保留。</p><p class="form-error" id="correction-error" role="alert"></p><div class="form-footer"><button class="button primary" type="submit">提交纠正</button>${link('topic/'+key,'暂时返回，保留草稿','text-button')}</div></form><aside class="form-aside"><h3>提交之后会怎样</h3><p>新的背景需要核验。结果会明确显示：哪些判断改变、哪些保持，以及修改的原因。</p><div class="example"><h3>试走一次完整修订</h3><p>这是独立原型。固定示例展示预设修订；自行输入会进入“待核验”，不会调用模型或改写判断。</p><p class="small muted">草稿仅在本次打开期间保留，刷新后重置。</p></div></aside></div>`;}
function revision(){if(!state.revised)return `${back()}<div class="empty"><h2>当前还没有完成的修订。</h2><p>阅读工作专题，再用虚构示例背景走一遍纠正过程。</p><div class="actions">${link('topic/work','阅读工作专题','button primary')}</div></div>`;return `${back('history','全部修订记录')}<div class="revision-layout"><article><div class="status-icon">${icon('check')}</div><div class="meta">${tag('修订已完成','current')}<span>版本 1 → 版本 2 · 示例结果</span></div><h1>把笼统的判断，<br>放回具体的情境。</h1><p class="lead">新的补充没有为你贴上另一种标签，而是让原来那句话的范围更准确。</p><div class="diff"><section><small>修订前 · 版本 1</small><p><del>${OLD}</del></p>${link('topic/work/1','回看旧版本','text-button')}</section><section class="new"><small>修订后 · 当前版本 2</small><p><ins>${NEW}</ins></p>${link('topic/work','阅读当前版本','text-button')}</section></div><section class="why"><h2>为什么这样改</h2><p>你补充了分工明确后主动接下任务的经历。这构成对“协作时倾向退后”的反例，因此撤去泛指协作的范围，保留职责不清时暂缓表达的具体情境。</p><button class="text-button" data-evidence="revision">核对这次使用的原话</button></section><ul class="change-list"><li><h3>这次改变了</h3><p>判断 J1 的适用范围；工作、表达专题及整体摘要中的相关表述。</p></li><li><h3>这些仍未确定</h3><p>所有迟疑的原因，以及精力、恢复和工作之外的表达模式。</p></li></ul><div class="actions">${link('overview','阅读修订后的整体认识','button primary')}${link('correct/work','还有背景需要补充','text-button')}</div></article><aside class="margin-notes"><section><h3>修订依据</h3><p>原记录 S2 与新增反例 S3。不是因为一次赞同，也不是重复计算同一来源。</p></section><section><h3>旧版本保留</h3><p>旧描述只供回看，不再作为当前认识展示。</p></section><section><h3>还可以继续修订</h3><p>这次范围更具体，不代表解释已经最终确定。</p></section></aside></div>`;}
function pendingPage(id){const item=state.pending[id];if(!item)return historyPage();return `${back('history','全部纠正与修订')}<div class="intro-block"><div class="meta">${tag('待核验','pending')}<span>当前版本保持不变</span></div><h1>背景已记录，<br>判断还没有改写。</h1><p class="lead">这是原型中的待处理状态。尚未核验的补充，不自动成为一个新的结论。</p></div><div class="target-quote"><span class="small muted">${TOPICS[item.topic].label} · ${item.reasonLabel}</span><blockquote class="pending-text">${escapeHTML(item.text)}</blockquote></div><div class="plain-unknown"><h3>当前没有运行分析</h3><p>你的补充保留在本次演示的记录中；正式处理应先核验背景，再说明判断保留、收窄、撤回或仍待澄清的原因。</p></div><div class="actions">${link('topic/'+item.topic,'回到当前认识','button primary')}${link('history','查看处理记录','text-button')}</div>`;}
function historyPage(){return `<div class="intro-block"><div class="meta"><span>纠正与修订</span><span>本次演示记录</span></div><h1>认识在变，<br>来由始终看得见。</h1><p class="lead">已完成的修订与待核验的补充分开。当前版本不会因为提交了反馈就自动改变。</p></div><div class="timeline">${state.pending.map((item,id)=>`<section class="timeline-item"><div class="meta">${tag('待核验','pending')}<span>当前版本不变</span></div><div class="card pending-card"><h2>${TOPICS[item.topic].label} · 收到新的背景</h2><p class="pending-text">${escapeHTML(item.text)}</p><div class="actions">${link('pending/'+id,'查看处理状态','text-button')}</div></div></section>`).reverse().join('')}${state.revised?`<section class="timeline-item current"><div class="meta">${tag('版本 2 · 当前','current')}<span>示例修订已完成</span></div><div class="card"><h2>从“协作时退后”，到“职责不清时暂缓”。</h2><p>新增分工明确时主动承担的反例，收窄了判断 J1 的范围。整体摘要和两个关联专题已更新。</p><div class="actions">${link('revision','查看修订前后','button primary')}${link('overview','阅读当前整体认识','text-button')}</div></div></section>`:''}<section class="timeline-item"><div class="meta">${tag('版本 1'+(state.revised?' · 历史':' · 当前'))}<span>最初的示例理解</span></div><div class="card"><h2>从两段经历，形成阶段性理解。</h2><p>目标与自主安排是有利条件；协作中的迟疑仍需背景；精力保持未知。</p><div class="actions">${link('topic/work'+(state.revised?'/1':''),state.revised?'回看版本 1':'阅读并核对判断','text-button')}</div></div></section></div>`;}
function evidence(context){let ids=context==='all'?[0,1]:context==='revision'?[1]:TOPICS[context]?.sourceIds||[0,1];if(state.revised&&!state.evidenceOld&&context!=='energy')ids=[...ids,2];return `<div class="meta"><span>原话、作用与局限</span>${tag(state.evidenceOld?'历史版本 1 · 示例来源':'虚构示例')}</div><p>先看说了什么，再看它能支持什么。</p><p class="disclosure">原话只证明当时有过这样的表达，不能独立证明一个稳定特征。同一来源不因出现在多个专题而重复计算。</p>${ids.map(id=>{const s=SOURCES[id];return `<section class="source"><span class="tag">${s.id} · ${s.type}</span><h3>示例记录 · ${s.name}</h3><blockquote>“${escapeHTML(s.quote)}”</blockquote><p class="source-effect">${s.effect}</p><p style="margin-top:12px">${id===0?'适用范围：这次项目整理。':id===1?'适用范围：这次职责不清的工作讨论。':'适用范围：这次分工明确后主动承担的补充。'}</p></section>`;}).join('')}<div class="actions">${state.evidenceOld?link('topic/'+context,'阅读当前版本','button primary'):context==='revision'?link('revision','回到修订结果','button primary'):link('correct/'+(TOPICS[context]?context:'work'),'原话或理解有误，我来补充','button primary')}<button class="button" data-close-drawer>返回阅读</button></div>`;}
function openEvidence(context){state.evidenceContext=context;state.evidenceOld=route().page==='topic'&&route().old&&state.revised&&route().topic!=='energy';state.lastFocus=document.activeElement;$('#evidence-body').innerHTML=evidence(context);$('#evidence-drawer').showModal();document.body.style.overflow='hidden';bindDrawer();}
function closeEvidence(restore=true){$('#evidence-drawer').close();document.body.style.overflow='';if(restore&&state.lastFocus?.isConnected)state.lastFocus.focus();}
function bindDrawer(){document.querySelectorAll('#evidence-body [data-route]').forEach(a=>a.onclick=e=>{e.preventDefault();closeEvidence(false);navigate(a.dataset.route);});document.querySelectorAll('[data-close-drawer]').forEach(b=>b.onclick=()=>closeEvidence());}
function render(){const r=route();const content=r.page==='home'?home():r.page==='overview'?overview():r.page==='topics'?topics():r.page==='topic'?topic(r.topic,r.old):r.page==='correct'?correction(r.topic):r.page==='revision'?revision():r.page==='pending'?pendingPage(r.pendingId):historyPage();$('#app').innerHTML=shell(content);bind();document.title='FindMe · '+({home:'整体认识',overview:'完整理解',topics:'专题阅读',topic:TOPICS[r.topic].label,correct:'纠正与补充',revision:'修订前后',history:'纠正与修订',pending:'待核验'}[r.page]);}
function navigate(to){if($('#evidence-drawer').open)closeEvidence(false);historyPush(to);render();window.scrollTo({top:0,behavior:'instant'});$('#main-content').focus({preventScroll:true});}
function historyPush(to){if(location.hash!=='#'+to)window.history.pushState({},'','#'+to);}
function bind(){document.querySelectorAll('#app [data-route]').forEach(a=>a.onclick=e=>{if(e.metaKey||e.ctrlKey||e.shiftKey||e.altKey)return;e.preventDefault();navigate(a.dataset.route);});document.querySelectorAll('[data-evidence]').forEach(b=>b.onclick=()=>openEvidence(b.dataset.evidence));document.querySelectorAll('[data-section]').forEach(a=>a.onclick=e=>{e.preventDefault();const el=document.getElementById(a.dataset.section);window.scrollTo({top:el.getBoundingClientRect().top+window.scrollY-24,behavior:matchMedia('(prefers-reduced-motion: reduce)').matches?'instant':'smooth'});});if($('#correction-form')){const text=$('#correction-text');text.oninput=()=>{state.draft.text=text.value;$('#correction-error').textContent='';text.removeAttribute('aria-invalid');};document.querySelectorAll('[name="reason"]').forEach(r=>r.onchange=()=>state.draft.reason=r.value);if($('#fill-example'))$('#fill-example').onclick=()=>{text.value=EXAMPLE;state.draft.text=EXAMPLE;state.draft.reason='context';document.querySelector('[value="context"]').checked=true;text.focus();};$('#correction-form').onsubmit=e=>{e.preventDefault();const value=text.value.trim();if(!value){$('#correction-error').textContent='请补充一点具体情况，再提交。';text.setAttribute('aria-invalid','true');text.focus();return;}const fixed=value===EXAMPLE&&state.draft.topic!=='energy'&&!state.revised;if(fixed){state.revised=true;state.draft.text='';navigate('revision');}else{const labels={context:'缺少重要背景',scope:'描述范围太宽',fact:'事实或归属有误',time:'现在已经不同'};state.pending.push({topic:state.draft.topic,text:value,reasonLabel:labels[state.draft.reason]});state.draft.text='';navigate('pending/'+(state.pending.length-1));}};}}
$('#close-drawer').innerHTML=icon('close');$('#close-drawer').onclick=()=>closeEvidence();$('#evidence-drawer').addEventListener('cancel',e=>{e.preventDefault();closeEvidence();});
window.addEventListener('popstate',()=>{if($('#evidence-drawer').open)closeEvidence(false);render();window.scrollTo({top:0,behavior:'instant'});});window.addEventListener('hashchange',()=>{if($('#evidence-drawer').open)closeEvidence(false);render();});render();
</script>
</body>
</html>
