{display:block}.aside{margin-top:30px}.report-title{font-size:31px}.report-intro{font-size:17px}.claim{padding:22px}.claim h2{font-size:22px}.detail-head{margin-bottom:18px}.diff{grid-template-columns:1fr;gap:10px}.dialog-body{padding:22px}.dialog-head{padding:14px 18px}.unknown{padding:22px}.actions{gap:10px}.history-card{padding:22px}}

r-radius:16px}.map-explainer .pill{align-self:flex-start}.report-title{font-weight:400}dialog .primary{background:var(--accent)}@media(max-width:700px){.hero-b{display:block;padding-bottom:28px}.hero-b h1{font-size:34px}.scope-b{margin-top:24px;padding:18px 0 0;border-left:0;border-top:1px solid var(--line)}.map-layout{grid-template-columns:1fr}.map{min-height:320px}.node{width:118px;height:118px;font-size:16px}.node:nth-of-type(1){left:calc(50% - 59px);top:18px}.node:nth-of-type(2){left:7%;bottom:35px}.node:nth-of-type(3){right:7%;bottom:35px}.map-explainer{border-left:0;border-top:1px solid var(--line);padding:24px}.b-bottom{grid-template-columns:1fr}.node-note{font-size:12px}.b-bottom .unknown{padding:22px}}

const DATA=[
{key:'work',label:'工作与投入',title:'投入需要空间，也需要清晰的边界。',summary:'在目标清楚、可以自主安排的工作中，你更容易持续投入。协作中的迟疑，还需要结合职责和情境理解。',claim:'协作时，你倾向于退后。',newClaim:'职责不清时，你会暂缓表达；分工明确后，你愿意主动承担。',detail:'几次经历都出现了“先弄清楚要做什么，再投入”的顺序。这可能与自主安排有关，也可能只是任务目标更明确。现有材料不足以区分两种解释。',scope:'只涉及示例中的两次工作经历，不能推及所有协作或生活场景。',unknown:'当职责清楚、但需要频繁沟通时，投入是否仍然顺畅？',evidence:[['示例记录一 · 项目整理','“目标定下来之后，我自己安排顺序，推进得很顺。”','支持：目标清楚与持续投入同时出现；尚不能单独归因为自主性。'],['示例记录二 · 协作讨论','“会上我没接话，因为不知道谁负责最后拍板。”','限制：迟疑发生在职责不明时，不能据此归纳为不愿协作。']]},
{key:'relation',label:'关系与表达',title:'表达之前，你在确认什么？',summary:'示例中，你会先确认讨论的边界和彼此的职责，再决定如何表达。沉默的原因仍需追问。',claim:'协作时，你倾向于退后。',newClaim:'职责不清时，你会暂缓表达；分工明确后，你愿意主动承担。',detail:'同一段协作记录既涉及工作安排，也涉及表达。两者共享来源，不构成两份独立证据。不能把同一段沉默分别累加为多个稳定特征。',scope:'当前仅涉及工作协作中的表达，不延伸到亲密关系或日常社交。',unknown:'在熟悉、没有职责分配的关系中，表达会不会不同？',evidence:[['示例记录二 · 协作讨论','“会上我没接话，因为不知道谁负责最后拍板。”','同源：与工作专题共享这段记录，不重复计算。'],['示例补充 · 反例','“上次分工说清楚之后，那块是我主动接下来的。”','反例：明确分工下曾主动参与，不支持普遍退后的描述。']]},
{key:'energy',label:'精力与节奏',title:'顺畅的投入，需要怎样的节奏？',summary:'示例中出现过连续投入的时段，但没有足够的睡眠、负担和恢复信息。精力仍保持未知。',claim:'目前无法判断稳定的精力模式。',newClaim:'目前无法判断稳定的精力模式。',detail:'任务完成顺利并不等于精力始终充足。没有足够材料时，不把高产解释为健康，也不把停顿解释为低能力。',scope:'现有材料只描述了工作过程，尚未覆盖身体感受、睡眠或恢复。',unknown:'投入顺利之后，是否需要较长恢复？当时还有哪些现实负担？',evidence:[['示例记录一 · 项目整理','“目标定下来之后，我自己安排顺序，推进得很顺。”','不足：这段话能描述过程，不能说明身体状态或恢复成本。']]}
];
const revisedText='上次分工说清楚之后，那块是我主动接下来的。我只是没弄清楚谁负责拍板，不是不愿意协作。';
const state={page:'home',topic:0,revised:false,pending:[],lastFocus:null};
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function mark(){return MARK;}
function nav(){return `<header class="topbar"><a class="brand" href="#home" aria-label="FindMe 整体认识">${mark()}找我<span>FindMe</span></a><nav class="nav" aria-label="主导航">${[['home','整体认识'],['topic','专题阅读'],['history','修订记录']].map(([key,label])=>`<button data-go="${key}" class="${state.page===key?'active':''}" ${state.page===key?'aria-current="page"':''}>${label}</button>`).join('')}</nav><span class="demo">虚构示例</span></header>`;}
function topicCards(){return DATA.map((d,i)=>`<button class="topic-card" data-topic="${i}"><span class="small">${i===2?'资料不足 · 保持未知':state.revised?'已纳入修订':'有依据 · 有待澄清'}</span><h3>${d.label}</h3><p>${i===0?'怎样的条件让投入更顺畅':i===1?'沉默发生在什么情境中':'工作顺畅之外，还缺什么信息'}</p><span class="read">阅读专题</span></button>`).join('');}
function unknown(){return `<div class="unknown"><h3>仍然不知道的部分</h3><p>精力与恢复的信息不足；两次工作经历也不能代表全部生活。这里保留空白，等待新的经历补充。</p></div>`;}
function summary(){return state.revised?'在自主安排、目标明确时，你更容易持续投入。新的背景让协作判断更具体：迟疑出现在职责不清时，并不代表不愿参与。':DATA[0].summary;}
function homeA(){return `<section class="hero-a"><div><div class="meta"><span>当前个人理解</span><span>版本 ${state.revised?'2':'1'} · 演示</span></div><h1>投入需要空间，<br>也需要清晰的边界。</h1><p class="lead">${summary()}</p><div class="actions"><button class="btn primary" data-topic="0">深入工作专题</button><button class="link" data-open="evidence">这份理解从哪里来</button></div></div><aside class="side-note"><div><span class="note-symbol" aria-hidden="true">“</span><p class="serif-note">不是一个定论。<br>是一份可以被你<br>修正的理解。</p></div><div><strong>阅读提示</strong><p>先读解释。觉得不准确时，可以直接指出具体哪句话，以及缺了什么背景。</p></div></aside></section><section class="section"><div class="section-head"><h2>从整体，走进具体</h2><small>三个专题 · 同一份理解</small></div><div class="topics">${topicCards()}</div></section><section class="section">${unknown()}</section>`;}
function mapMarkup(){return `<div class="map"><svg viewBox="0 0 600 380" aria-hidden="true"><path d="M300 95 L150 272 L450 272 Z" fill="none" stroke="#79917c" stroke-width="1" stroke-dasharray="4 6"/><circle cx="300" cy="228" r="5" fill="#d3ef8c"/><path d="M300 120v103M170 265l125-35M430 265l-125-35" stroke="#79917c" fill="none"/></svg>${DATA.map((d,i)=>`<button class="node ${state.topic===i?'selected':''}" data-map="${i}" aria-pressed="${state.topic===i}">${d.label}<small>${i===2?'信息不足':'共同情境'}</small></button>`).join('')}<div class="node-note">连线表示共同情境，不表示因果关系</div></div>`;}
function homeB(){const d=DATA[state.topic];return `<section class="hero-b"><div><div class="meta"><span>当前个人理解</span><span>版本 ${state.revised?'2':'1'} · 演示</span></div><h1>投入需要空间，<br>也需要清晰的边界。</h1><p class="lead">${summary()}</p></div><aside class="scope-b"><span class="pill">有范围的理解</span><p>从具体情境认识自己。<br>同一件事，可以连起不同专题；<br>还不知道的部分，留在图中。</p></aside></section><section class="map-layout" aria-label="专题关系与阅读入口">${mapMarkup()}<div class="map-explainer"><span class="pill">${state.topic===2?'保持未知':'情境：一次职责不清的协作'}</span><h2>${d.label}</h2><p>${d.summary}</p><div class="actions"><button class="btn primary" data-topic="${state.topic}">进入这个专题</button><button class="link" data-open="evidence">查看依据</button></div></div></section><div class="b-bottom">${unknown()}<div class="unknown"><h3>值得澄清的一处</h3><p>${state.revised?'新的背景已将“退后”收窄为“职责不清时暂缓表达”。':'“协作时倾向退后”是否遗漏了职责不清这一背景？'}</p><button class="link" data-topic="0">${state.revised?'查看修订后的理解':'看看这句话'}</button></div></div>`;}
function homeC(){return `<section class="hero-c"><div class="current-card"><div class="meta"><span>当前个人理解</span><span>版本 ${state.revised?'2':'1'} · 演示</span></div><h1>投入需要空间，<br>也需要清晰的边界。</h1><p class="lead">${summary()}</p><div class="actions"><button class="btn primary" data-topic="0">深入工作专题</button><button class="link" data-open="evidence">查看依据</button></div></div><aside class="c-question"><div class="question-mark" aria-hidden="true">?</div><span class="small">${state.revised?'新的背景，让理解更具体':'这份理解，留了一个问号'}</span><h2 style="margin-top:12px">${state.revised?'从退后，到暂缓表达。':'迟疑，是不愿参与，<br>还是分工还不清楚？'}</h2><p>${state.revised?'原先对协作的描述过宽。示例修订已纳入当前认识，旧版本仍可回看。':'解释还没有定下来。你知道的背景，可能改变这句话的含义。'}</p><div class="actions"><button class="btn" data-topic="0">${state.revised?'查看当前判断':'读这条判断'}</button></div></aside></section><section class="section"><div class="section-head"><h2>理解自己的不同侧面</h2><small>按需要展开</small></div><div class="topics">${topicCards()}</div></section><div class="c-update"><span class="stamp" aria-hidden="true">${state.revised?'✓':'↺'}</span><div class="copy"><h3>${state.revised?'一处判断，刚刚变得更准确':'理解会更新，过去也有迹可循'}</h3><p>${state.revised?'版本 2 已纳入示例补充；没有把一次同意当作独立证据。':'纠正时看得见处理结果，也能回到原先的版本。'}</p></div><button class="link" data-go="history">查看修订记录</button></div><section class="section">${unknown()}</section>`;}
function topic(){const d=DATA[state.topic],has=state.revised&&state.topic!==2;return `<div class="detail-head"><button class="back" data-go="home">‹　整体认识</button><span class="small muted">虚构示例 / 阅读与纠正</span></div><nav class="topic-tabs" aria-label="专题切换">${DATA.map((d,i)=>`<button data-topic="${i}" aria-pressed="${state.topic===i}">${d.label}</button>`).join('')}</nav><div class="detail-grid"><article><div class="meta"><span>${d.label}</span><span>版本 ${has?'2':'1'}</span><span class="pill">${state.topic===2?'资料不足':'阶段性理解'}</span></div><h1 class="report-title">${d.title}</h1><p class="report-intro">${state.topic===0?summary():d.summary}</p><section class="report-section"><h2>目前怎样理解</h2><p>${d.detail}</p></section><section class="claim"><span class="pill">${has?'已收窄判断范围':state.topic===2?'保持未知':'值得你核对的判断'}</span><h2>${has?d.newClaim:d.claim}</h2><p>${has?'这次补充提供了分工明确时主动参与的反例。当前描述只保留职责不清的情境，不再泛指协作。':state.topic===2?'这里没有补齐一个貌似完整的结论。你可以查看目前材料，也可以补充新的背景。':'这句话可能说得太宽。职责、沟通和当时的处境，可能是还没写进来的重要背景。'}</p><div class="actions"><button class="btn" data-open="evidence">查看依据与反例</button><button class="btn primary" data-open="correction">${state.topic===2?'补充背景':'纠正这句话'}</button></div>${has?'<button class="link" data-go="history">查看修订前后</button>':''}</section><section class="report-section"><h2>还可能怎样解释</h2><p>${state.topic===2?'顺畅可能来自任务简单、外部支持或短期集中，不足以推定稳定精力。':'迟疑可能来自决策职责不明确，也可能来自尚未形成观点。仅凭这次沉默，无法判断哪种解释更合适。'}</p></section><section class="report-section"><h2>接下来值得理解</h2><p>${d.unknown}</p></section></article><aside class="aside"><section><h3>这份理解的范围</h3><p>${d.scope}</p></section><section><h3>尚未确定</h3><p>${d.unknown}</p></section><section><h3>随时可以纠正</h3><p>事实、背景、时间或解释有偏差，都可以指出。补充不会自动变成一个新定论。</p><button class="link" data-open="correction">${state.topic===2?'补充背景':'纠正当前判断'}</button></section></aside></div>`;}
function diff(){return `<div class="diff"><div><small>修订前 · 版本 1</small><del>${DATA[0].claim}</del></div><div><small>修订后 · 版本 2</small><ins>${DATA[0].newClaim}</ins></div></div>`;}
function history(){return `<div class="meta"><span>版本与来由</span><span>仅本次打开期间保留演示状态</span></div><h1>理解是怎样改变的。</h1><p class="lead">每次修订都应该说清楚：哪句话变了，为什么变，哪些部分依然不知道。</p>${state.revised?`<article class="history-card"><div class="meta"><span class="pill">已完成 · 示例修订</span><span>版本 1 → 版本 2</span></div><h2>把普遍描述，收窄到具体情境。</h2>${diff()}<p class="muted">改变原因：补充了分工明确时主动承担的反例。旧描述的范围过宽，因此收窄到职责不清的情境；尚未证明所有沉默都由职责不清造成。</p><div class="actions"><button class="btn primary" data-topic="0">阅读当前版本</button></div></article>`:`<article class="history-card"><h2>当前是版本 1，尚未发生修订。</h2><p class="muted" style="margin-top:12px">你可以进入工作专题，查看“协作时倾向退后”这句判断，并用示例背景走一遍纠正过程。</p><div class="actions"><button class="btn primary" data-topic="0">去核对这条判断</button></div></article>`}${state.pending.map(x=>`<article class="history-card"><span class="pill">待核验 · 当前版本不变</span><h2 style="margin-top:12px">${esc(x.topic)}：收到一条补充</h2><p style="white-space:pre-wrap;margin-top:16px">${esc(x.text)}</p><p class="muted" style="margin-top:16px">原型没有运行分析，未据此改写认识。正式产品应核验材料后展示处理结果。</p></article>`).join('')}`;}
function render(){const oldScroll=window.scrollY;document.getElementById('app').innerHTML=nav()+`<main id="content" class="animate">${state.page==='home'?(VARIANT===1?homeA():VARIANT===2?homeB():homeC()):state.page==='topic'?topic():history()}</main><footer class="footer"><span>FindMe　/　${DIRECTION}</span><span>设计原型 · 全部内容为虚构示例 · 未连接真实数据</span></footer>`;bind();}
function go(page,index){state.page=page;if(index!==undefined)state.topic=Number(index);location.hash=page==='topic'?'topic-'+state.topic:page;render();window.scrollTo({top:0,behavior:'instant'});$('#content').setAttribute('tabindex','-1');$('#content').focus({preventScroll:true});}
function bind(){document.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>go(b.dataset.go));document.querySelectorAll('[data-topic]').forEach(b=>b.onclick=()=>go('topic',b.dataset.topic));document.querySelectorAll('[data-open]').forEach(b=>b.onclick=()=>{if(state.page==='home'&&VARIANT!==2)state.topic=0;openDialog(b.dataset.open);});document.querySelectorAll('[data-map]').forEach(b=>b.onclick=()=>{state.topic=Number(b.dataset.map);render();document.querySelector(`[data-map="${state.topic}"]`).focus({preventScroll:true});});document.querySelector('.brand').onclick=e=>{e.preventDefault();go('home');};}
function evidence(){const d=DATA[state.topic];return `<span class="pill">${d.label} · 虚构示例来源</span><p class="notice">记录只能说明当时表达了什么，不能独立证明一个稳定特征。共享的来源不重复计算。</p>${d.evidence.map(([title,quote,reason])=>`<section class="evidence-item"><h3>${title}</h3><blockquote>${quote}</blockquote><p>${reason}</p></section>`).join('')}${state.revised&&state.topic!==2?`<section class="evidence-item"><h3>示例补充 · 修订依据</h3><blockquote>“${revisedText}”</blockquote><p>新增反例用于收窄判断范围，用户认可不额外计算为独立证据。</p></section>`:''}<div class="actions"><button class="btn primary" data-dialog-action="correct">${state.topic===2?'补充背景':'这句话需要纠正'}</button></div>`;}
function correction(){return `<p class="small muted">正在回应：${state.revised?DATA[state.topic].newClaim:DATA[state.topic].claim}</p><form id="correction-form"><fieldset style="border:0;padding:0;margin:20px 0"><legend style="font-weight:600;margin-bottom:8px">哪里需要重新理解？</legend>${[['context','缺少背景'],['scope','描述范围太宽'],['fact','事实或归属有误'],['time','现在已经不同']].map(([v,t],i)=>`<label class="choice"><input type="radio" name="reason" value="${v}" ${i===0?'checked':''}>${t}</label>`).join('')}</fieldset><label class="field-label" for="context">补充你知道的情况</label><textarea id="context" name="context" placeholder="哪句话不准确？还有什么重要背景？" required></textarea>${state.topic!==2?'<button type="button" class="link" id="fill-demo">填入虚构示例背景</button>':''}<p class="notice" style="margin-top:16px">只有填入固定示例，才演示预设修订。自行输入的内容会显示“待核验”，原型不会生成个人判断。</p><p id="form-error" class="form-error" role="alert"></p><button type="submit" class="btn primary">提交纠正</button></form>`;}
function openDialog(kind){const dlg=$('#dialog');if(!dlg.open)state.lastFocus=document.activeElement;$('#dialog-title').textContent=kind==='evidence'?'依据与反例':state.topic===2?'补充背景':'让这句话更准确';$('#dialog-content').innerHTML=kind==='evidence'?evidence():correction();if(!dlg.open){dlg.showModal();document.body.style.overflow='hidden';}wireDialog(kind);}
function wireDialog(kind){const correct=document.querySelector('[data-dialog-action="correct"]');if(correct)correct.onclick=()=>openDialog('correction');if(kind==='correction'){const fill=$('#fill-demo');if(fill)fill.onclick=()=>{$('#context').value=revisedText;$('#context').focus();};$('#correction-form').onsubmit=e=>{e.preventDefault();const value=$('#context').value.trim();if(!value){$('#form-error').textContent='请补充一点背景，再提交。';return;}const fixed=value===revisedText&&state.topic!==2;if(fixed)state.revised=true;else state.pending.push({topic:DATA[state.topic].label,text:value});render();$('#dialog-title').textContent=fixed?'当前认识已修订':'补充已记录，等待核验';$('#dialog-content').innerHTML=fixed?`<div class="success-mark" aria-hidden="true">✓</div><span class="pill">演示结果 · 版本 2</span><h2>原先那句话，说得太宽。</h2>${diff()}<p class="muted">补充让范围更清楚，但还没有确定所有迟疑的原因。精力状态仍保持未知。</p><div class="actions"><button class="btn primary" id="read-result">阅读修订后的专题</button><button class="btn" id="see-history">查看修订记录</button></div>`:`<span class="pill">待核验 · 当前版本不变</span><h2>已保留你补充的背景。</h2><p class="muted" style="margin-top:16px">原型没有运行分析，因此暂不改写结论。你可以在修订记录中回看这条补充。</p><div class="actions"><button class="btn primary" id="see-history">查看修订记录</button></div>`;if($('#read-result'))$('#read-result').onclick=()=>{closeDialog(false);go('topic',state.topic);};$('#see-history').onclick=()=>{closeDialog(false);go('history');};$('#dialog-title').focus();};}}
function closeDialog(restore=true){$('#dialog').close();document.body.style.overflow='';if(restore&&state.lastFocus?.isConnected)state.lastFocus.focus();}
$('#dialog-close').onclick=()=>closeDialog();$('#dialog').addEventListener('cancel',e=>{e.preventDefault();closeDialog();});$('#dialog').addEventListener('click',e=>{if(e.target===$('#dialog')){const r=$('#dialog').getBoundingClientRect();if(e.clientX<r.left||e.clientX>r.right||e.clientY<r.top||e.clientY>r.bottom)closeDialog();}});
window.addEventListener('hashchange',()=>{const hash=location.hash.slice(1);const match=hash.match(/^topic-([012])$/);if(match){state.page='topic';state.topic=Number(match[1]);}else if(['home','history'].includes(hash))state.page=hash;else return;render();});
const hash=location.hash.slice(1),match=hash.match(/^topic-([012])$/);if(match){state.page='topic';state.topic=Number(match[1]);}else if(hash==='history')state.page='history';render();
</script></body></html>
