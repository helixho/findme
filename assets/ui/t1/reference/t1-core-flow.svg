<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="760" viewBox="0 0 1600 760"><rect width="1600" height="760" fill="#FAFAF8"/><style>.h1{font:700 48px Inter,'PingFang SC',sans-serif;fill:#111827}.h2{font:700 24px Inter,'PingFang SC',sans-serif;fill:#0F2D3D}.body{font:400 20px Inter,'PingFang SC',sans-serif;fill:#4B5563}.num{font:700 20px Inter,Arial;fill:white}</style><text x="70" y="90" class="h1">T1 · 方案 C 品牌融合核心流程</text><text x="70" y="130" class="body">开始 → 引导探索 → 观察与解释 → 查看依据 → 调整理解 → 更新后的认识</text><rect x="70" y="250" width="205" height="270" rx="22" fill="white" stroke="#D1D5DB"/><circle cx="102" cy="284" r="18" fill="#0EA5A0"/><text x="96" y="291" class="num">1</text><text x="94" y="345" class="h2">开始</text><text x="94" y="385" class="body">从一个具体事件开始</text><rect x="94" y="430" width="157" height="52" rx="12" fill="#E6F4F2"/><text x="110" y="463" class="body">可修订</text><path d="M280 385 H308" stroke="#0EA5A0" stroke-width="4"/><path d="M302 377 L312 385 L302 393" fill="none" stroke="#0EA5A0" stroke-width="4"/><rect x="315" y="250" width="205" height="270" rx="22" fill="white" stroke="#D1D5DB"/><circle cx="347" cy="284" r="18" fill="#0EA5A0"/><text x="341" y="291" class="num">2</text><text x="339" y="345" class="h2">引导探索</text><text x="339" y="385" class="body">一次一个问题，允许跳过</text><rect x="339" y="430" width="157" height="52" rx="12" fill="#E6F4F2"/><text x="355" y="463" class="body">可修订</text><path d="M525 385 H553" stroke="#0EA5A0" stroke-width="4"/><path d="M547 377 L557 385 L547 393" fill="none" stroke="#0EA5A0" stroke-width="4"/><rect x="560" y="250" width="205" height="270" rx="22" fill="white" stroke="#D1D5DB"/><circle cx="592" cy="284" r="18" fill="#0EA5A0"/><text x="586" y="291" class="num">3</text><text x="584" y="345" class="h2">观察与解释</text><text x="584" y="385" class="body">分开观察、解释、未知</text><rect x="584" y="430" width="157" height="52" rx="12" fill="#E6F4F2"/><text x="600" y="463" class="body">可修订</text><path d="M770 385 H798" stroke="#0EA5A0" stroke-width="4"/><path d="M792 377 L802 385 L792 393" fill="none" stroke="#0EA5A0" stroke-width="4"/><rect x="805" y="250" width="205" height="270" rx="22" fill="white" stroke="#D1D5DB"/><circle cx="837" cy="284" r="18" fill="#0EA5A0"/><text x="831" y="291" class="num">4</text><text x="829" y="345" class="h2">查看依据</text><text x="829" y="385" class="body">来源、支持、反例可展开</text><rect x="829" y="430" width="157" height="52" rx="12" fill="#E6F4F2"/><text x="845" y="463" class="body">可修订</text><path d="M1015 385 H1043" stroke="#0EA5A0" stroke-width="4"/><path d="M1037 377 L1047 385 L1037 393" fill="none" stroke="#0EA5A0" stroke-width="4"/><rect x="1050" y="250" width="205" height="270" rx="22" fill="white" stroke="#D1D5DB"/><circle cx="1082" cy="284" r="18" fill="#0EA5A0"/><text x="1076" y="291" class="num">5</text><text x="1074" y="345" class="h2">调整理解</text><text x="1074" y="385" class="body">补背景、纠错、缩小范围</text><rect x="1074" y="430" width="157" height="52" rx="12" fill="#E6F4F2"/><text x="1090" y="463" class="body">可修订</text><path d="M1260 385 H1288" stroke="#0EA5A0" stroke-width="4"/><path d="M1282 377 L1292 385 L1282 393" fill="none" stroke="#0EA5A0" stroke-width="4"/><rect x="1295" y="250" width="205" height="270" rx="22" fill="white" stroke="#D1D5DB"/><circle cx="1327" cy="284" r="18" fill="#0EA5A0"/><text x="1321" y="291" class="num">6</text><text x="1319" y="345" class="h2">更新后的认识</text><text x="1319" y="385" class="body">说明改了什么与为什么</text><rect x="1319" y="430" width="157" height="52" rx="12" fill="#E6F4F2"/><text x="1335" y="463" class="body">可修订</text><text x="70" y="640" class="body">设计原则：结构由系统承担，不把探索变成表单；纠正是随时可用入口，不强制成为每次必经步骤。</text><text x="70" y="690" class="body">Brand: Open Frame · Product UX: Scheme C · 目标：Human reflection × evidence-based structure.</text></svg>